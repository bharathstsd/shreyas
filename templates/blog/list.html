{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Blog – Madhura Wellness</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Manrope', sans-serif; background: #f6f8f7; }
        .gold-text {
            background: linear-gradient(to bottom right, #d4af37, #fcf6ba, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

<!-- Simple Header -->
<div class="bg-white shadow p-4 text-center font-bold text-xl">
    <a href="/">Madhura Wellness</a>
</div>

<section class="py-16 px-6">
  <div class="max-w-7xl mx-auto">

    <div class="text-center mb-16">
      <h2 class="text-sm text-green-500 uppercase font-bold mb-4">
        Knowledge Center
      </h2>
      <h1 class="text-4xl md:text-5xl font-light">
        Wellness <span class="italic gold-text">Insights</span>
      </h1>
    </div>

    <div class="grid md:grid-cols-3 gap-10">

      {% for post in posts %}
      <a href="/blog/{{ post.slug }}/"
         class="group bg-white rounded-xl overflow-hidden shadow hover:shadow-2xl transition">

        {% if post.image %}
        <div class="h-56 overflow-hidden">
          <img src="{{ post.image.url }}"
               class="w-full h-full object-cover group-hover:scale-110 transition">
        </div>
        {% endif %}

        <div class="p-6">
          <span class="text-xs uppercase text-yellow-600 font-bold">
            {{ post.category }}
          </span>

          <h3 class="text-xl font-semibold mt-2 group-hover:text-green-600 transition">
            {{ post.title }}
          </h3>

          <p class="text-slate-500 mt-3 text-sm">
            {{ post.content|striptags|truncatewords:20 }}
          </p>

          <div class="mt-4 text-green-600 font-semibold">
            Read Article →
          </div>
        </div>
      </a>
      {% endfor %}

    </div>

  </div>
</section>

</body>
</html>
