{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{ program.title }} | Program</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: { primary: "#11d473" },
            fontFamily: { display: ["Manrope"] }
        }
    }
}
</script>
</head>

<body class="bg-white font-display text-slate-800">

<!-- HERO -->
<section class="relative h-[60vh]">
    <img src="{{ program.image.url }}"
         class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-black/50 flex items-center justify-center">
        <h1 class="text-4xl md:text-6xl font-extrabold text-white text-center">
            {{ program.title }}
        </h1>
    </div>
</section>

<!-- CONTENT -->
<section class="py-20">
    <div class="max-w-4xl mx-auto px-6 text-center">

        <span class="text-primary font-bold uppercase tracking-widest">
            {{ program.category }}
        </span>

        <p class="text-lg text-slate-600 mt-6 leading-relaxed">
            {{ program.description }}
        </p>

        <!-- FEATURES -->
        <div class="mt-10 grid md:grid-cols-2 gap-4 text-left">
            {% for feature in program.feature_list %}
            <div class="flex items-center gap-3 bg-gray-50 p-4 rounded-xl">
                <span class="material-icons text-primary">check_circle</span>
                <span class="font-medium">{{ feature }}</span>
            </div>
            {% endfor %}
        </div>

        <!-- CTA -->
        <div class="mt-14">
            <a href="/book/"
               class="inline-block px-10 py-4 bg-primary text-white text-lg font-bold rounded-full shadow-xl hover:scale-105 transition">
                Book This Program
            </a>
        </div>

    </div>
</section>

</body>
</html>
