{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Client</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f3f5f7;
            color: #222;
        }

        .app {
            max-width: 500px;
            margin: auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: white;
            padding: 15px;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .content {
            padding: 15px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        form p {
            margin-bottom: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            display: block;
            margin-bottom: 5px;
        }

        .button {
            display: block;
            width: 100%;
            background: #2e7d32;
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            border: none;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #1976d2;
            text-decoration: none;
            font-size: 14px;
        }
        input[type="date"] {
    appearance: none;
    -webkit-appearance: none;
}

    </style>
</head>
<body>

<div class="app">

    <!-- Header -->
    <div class="header">
        Add Client
    </div>

    <div class="content">
        <div class="card">

            {% comment %} <form method="post"> {% endcomment %}
             <form method="post" enctype="multipart/form-data">

                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="button">
                    Save Client
                </button>
            </form>

            <a class="back-link" href="{% url 'coach_dashboard' coach.slug %}">
                <- Back to dashboard
            </a>

        </div>
    </div>

</div>

</body>
</html>
