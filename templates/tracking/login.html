<!DOCTYPE html>
<html>
<head>
    <title>Coach Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0a2b1a, #2e7d32);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            padding: 32px 28px;
            border-radius: 18px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        .logo {
            width: 70px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #777;
            margin-bottom: 22px;
        }

        form p {
            margin-bottom: 14px;
            text-align: left;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 2px rgba(46,125,50,0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            background: #256628;
        }

        .footer-text {
            margin-top: 18px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="login-card">

    <!-- Optional logo -->
    <img src="{{ brand.logo_url }}" class="logo" alt="Logo">

    <div class="title">Coach Login</div>
    <div class="subtitle">Access your client dashboard</div>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <div class="footer-text">
        Shreyas Wellness World
    </div>

</div>

</body>
</html>
