{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }} - Shreyas Wellness</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: { primary: "#11d473" },
                fontFamily: { display: ["Manrope", "sans-serif"] }
            }
        }
    };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        body { font-family: 'Manrope', sans-serif; background: #f6f8f7; }
    </style>
</head>
<body>

<!-- NAVBAR -->
{% include "includes/navbar.html" %}

<section class="pt-28 md:pt-32 pb-16 px-6">
  <div class="max-w-4xl mx-auto">

    <a href="/blog/" class="inline-flex items-center gap-2 text-primary font-semibold mb-8 hover:text-primary/80 transition-colors">
      <span class="material-icons text-base">arrow_back</span> Back to Blog
    </a>

    <h1 class="text-4xl md:text-5xl font-light mb-6">
      {{ post.title }}
    </h1>

    <p class="text-sm text-slate-500 mb-8">
      {{ post.created_at|date:"F d, Y" }}
    </p>

    {% if post.image %}
    <img src="{{ post.image.url }}"
         class="w-full rounded-xl mb-10">
    {% endif %}

    <div class="prose max-w-none bg-white p-8 rounded-xl shadow">
      {{ post.content|safe }}
    </div>

  </div>
</section>

<script>
  const toggleBtn = document.getElementById("menuToggle");
  const mobileMenu = document.getElementById("mobileMenu");

  if (toggleBtn && mobileMenu) {
    toggleBtn.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });
  }
</script>
</body>
</html>
